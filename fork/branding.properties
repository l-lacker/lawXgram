# The only source of Neogram's identity. Everything user-visible that names the app,
# identifies it to Android or points to the project reads these values (Gradle passes them
# to BuildConfig/resValues/manifest placeholders, Java reads them through NeoBrand).
# Brand graphics (launcher icons etc.) live in fork/app/res, see docs/branding.md.

app.name=Neogram
app.nameBeta=Neogram Beta
app.applicationId=ru.llacker.neogram
app.applicationIdSuffixDebug=.beta
app.apkBaseName=Neogram
# Folder name used in Pictures/, Download/ etc.
app.mediaFolder=Neogram

# Links shown in the app. Leave a value empty to hide the corresponding row.
links.sourceCode=https://github.com/l-lacker/lawXgram
links.issues=https://github.com/l-lacker/lawXgram/issues
links.channel=
links.translate=
links.donate=

# Self-updates for direct (non-Play) builds come from GitHub releases of this repository.
updates.githubRepo=l-lacker/lawXgram

# SHA-256 fingerprint of the release signing certificate (colon-separated hex), used by CI
# to verify release APKs. Leave empty until the release key is final.
signing.releaseCertSha256=
