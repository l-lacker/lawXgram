plugins {
    id 'com.android.application' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'io.sentry.android.gradle' version '6.0.0' apply false
    id 'org.lsposed.lsparanoid' version '0.5.2'
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.library") ||
                plugins.hasPlugin("com.android.application")) {
            android {
                compileSdkVersion 36
                buildToolsVersion "36.1.0"
                ndkVersion = "27.3.13750724"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_21
                    targetCompatibility JavaVersion.VERSION_21

                    coreLibraryDesugaringEnabled = true
                }

                defaultConfig {
                    minSdkVersion 23
                    targetSdkVersion 36
                }

                buildTypes {
                    play {
                        initWith release
                    }
                }

                buildFeatures.buildConfig = true
            }

            // Strip JLatexMath assets we don't ship (~310 KB of optional fonts and
            // license text). Has to live in the APK modules: a library's
            // androidResources.ignoreAssetsPattern doesn't filter packaging in apps
            // that consume it.
            //   keep: base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak)
            //   drop: latin/optional/, maths/optional/, licences/
            if (plugins.hasPlugin("com.android.application")) {
                android {
                    androidResources {
                        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
                    }
                }
            }

            dependencies {
                coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
            }
        }
    }
}
