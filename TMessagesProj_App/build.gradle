import com.android.build.api.variant.FilterConfiguration

plugins {
    id 'com.android.application'
    id 'io.sentry.android.gradle'
}

def hasGoogleServicesConfig = file('src/debug/google-services.json').exists() ||
        file('src/release/google-services.json').exists() ||
        file('google-services.json').exists()

Properties localProperties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    localProperties.load(project.rootProject.file('local.properties').newDataInputStream())
}

Properties sentryProperties = new Properties()
[file('sentry.properties'), project.rootProject.file('sentry.properties')].each { sentryPropertiesFile ->
    if (sentryPropertiesFile.exists()) {
        sentryProperties.load(sentryPropertiesFile.newDataInputStream())
    }
}

def hasText = { value -> value != null && !value.trim().isEmpty() }
def sentryOrg = providers.environmentVariable('SENTRY_ORG').orNull ?: sentryProperties.getProperty('defaults.org')
def sentryProject = providers.environmentVariable('SENTRY_PROJECT').orNull ?: sentryProperties.getProperty('defaults.project')
def sentryAuthToken = providers.environmentVariable('SENTRY_AUTH_TOKEN').orNull ?: sentryProperties.getProperty('auth.token')
def hasSentryUploadConfig = hasText(sentryOrg) && hasText(sentryProject) && hasText(sentryAuthToken)

if (hasGoogleServicesConfig) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found, skipping Google Services plugin for local builds')
}

if (!hasSentryUploadConfig) {
    logger.lifecycle('Sentry upload config not found, skipping Sentry artifact uploads for local builds')
}

dependencies {
    implementation project(':TMessagesProj')
}

sentry {
    includeProguardMapping = hasSentryUploadConfig
    autoUploadProguardMapping = hasSentryUploadConfig
    uploadNativeSymbols = hasSentryUploadConfig
    autoUploadNativeSymbols = hasSentryUploadConfig
    includeSourceContext = hasSentryUploadConfig
    additionalSourceDirsForSourceContext = hasSentryUploadConfig ? [ '../TMessagesProj/src/main/java' ] : []
    autoInstallation {
        enabled = false
    }
    ignoredBuildTypes = ["debug"]
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    packagingOptions {
        resources {
            excludes += '**'
        }
    }

    signingConfigs {
        if (localProperties.getProperty("storeFile") != null) {
            sign {
                storeFile file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.sign
            }
            applicationIdSuffix ".beta"
        }

        release {
            minifyEnabled true
            shrinkResources = true
            vcsInfo.include = false
            if (localProperties.getProperty("storeFile") != null) {
                signingConfig signingConfigs.sign
            } else {
                signingConfig = signingConfigs.debug
            }
            proguardFiles '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    defaultConfig {
        versionName APP_VERSION_NAME

        multiDexEnabled = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    splits.abi {
        var buildingBundle = gradle.startParameter.taskNames.any { it.startsWith("bundle") }
        enable = !buildingBundle
        universalApk = true

        reset()
        include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }
    namespace = 'org.telegram.messenger.regular'

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def abiName = abi ?: "universal"
            def baseVersionCode = output.versionCode.get()
            output.outputFileName.set("lawXgram-${output.versionName.get()}-${baseVersionCode}-${abiName}.apk")
            output.versionCode.set(baseVersionCode * 10)
        }
    }
}
