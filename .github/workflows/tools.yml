name: tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: patchset tool tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Unit tests
        run: python -m unittest discover -s tools/tests -v

  patches:
    name: patches apply and are canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint
        run: python tools/patchset.py lint --fast
      - name: Check (sparse, from scratch)
        run: python tools/patchset.py check --sparse

  core:
    name: fork/core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: JUnit
        run: gradle -p fork/core test --console=plain
