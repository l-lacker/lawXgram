name: release

# Signed release APKs (every ABI plus universal) published as a GitHub release, which is where
# the in-app updater of direct builds looks (NeoUpdater: newest release, APK per ABI, SHA256SUMS).
#
# Repository secrets:
#   NEO_TELEGRAM_API_ID, NEO_TELEGRAM_API_HASH   https://my.telegram.org
#   NEO_KEYSTORE_BASE64                          release keystore, base64-encoded
#   NEO_SIGNING_STORE_PASSWORD, NEO_SIGNING_KEY_ALIAS, NEO_SIGNING_KEY_PASSWORD
#   NEO_SENTRY_DSN, NEO_MAPS_API_KEY             optional
# fork/branding.properties signing.releaseCertSha256, when set, must match the keystore.

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Neogram revision on this upstream version (0-9, last digit of versionCode)'
        required: true
        default: '0'
      prerelease:
        description: 'Mark as pre-release (the in-app updater skips pre-releases)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check inputs
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9]$ ]] || { echo "revision must be a single digit"; exit 1; }
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEO_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "NEO_KEYSTORE_BASE64 is not set"; exit 1; }
          mkdir -p local
          echo "$KEYSTORE_BASE64" | base64 -d > local/release.jks
      - name: Upstream and patches
        run: python tools/patchset.py setup --ci
      - name: Build
        working-directory: worktree
        env:
          NEO_TELEGRAM_API_ID: ${{ secrets.NEO_TELEGRAM_API_ID }}
          NEO_TELEGRAM_API_HASH: ${{ secrets.NEO_TELEGRAM_API_HASH }}
          NEO_SIGNING_STORE_FILE: local/release.jks
          NEO_SIGNING_STORE_PASSWORD: ${{ secrets.NEO_SIGNING_STORE_PASSWORD }}
          NEO_SIGNING_KEY_ALIAS: ${{ secrets.NEO_SIGNING_KEY_ALIAS }}
          NEO_SIGNING_KEY_PASSWORD: ${{ secrets.NEO_SIGNING_KEY_PASSWORD }}
          NEO_SENTRY_DSN: ${{ secrets.NEO_SENTRY_DSN }}
          NEO_MAPS_API_KEY: ${{ secrets.NEO_MAPS_API_KEY }}
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -Pneo.revision=${{ inputs.revision }} --console=plain
      - name: Verify signatures and write checksums
        id: files
        run: |
          set -euo pipefail
          out=worktree/TMessagesProj_App/build/outputs/apk/afat/release
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          expected=$(grep -E '^signing.releaseCertSha256=' fork/branding.properties | cut -d= -f2- | tr -d ' :' | tr 'A-F' 'a-f')
          cd "$out"
          ls *.apk > /dev/null
          for apk in *.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            echo "$apk: $digest"
            if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
              echo "$apk is signed with $digest, branding expects $expected"; exit 1
            fi
          done
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
          PRERELEASE: ${{ inputs.prerelease }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          set -euo pipefail
          version=$(grep -E '^upstream.version=' patchset.properties | cut -d= -f2-)
          tag="v${version}-${REVISION}"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Based on Telegram ${version}, revision ${REVISION}." "${flags[@]}" \
            "$DIR"/*.apk "$DIR"/SHA256SUMS
