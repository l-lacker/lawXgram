# Crowdin: Neogram's own strings only (Telegram's strings come from Telegram's translation platform).
# Source fork/res/values/strings_neo.xml, translations fork/res/values-<code>/strings_neo.xml.
# Rules for translators and contributors are in AGENTS.md (keys start with "Neo", the app name is
# always a %N$s argument, no <plurals>, apostrophes escaped as \').
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
preserve_hierarchy: true

files:
  - source: /fork/res/values/strings_neo.xml
    translation: /fork/res/values-%android_code%/strings_neo.xml
    languages_mapping:
      android_code:
        # Crowdin codes whose Android folder differs from %android_code%
        zh-CN: zh-rCN
        zh-TW: zh-rTW
        pt-BR: pt-rBR
        es-ES: es
        sv-SE: sv
        # "zh_dg" is the Telegram "Classical Chinese" pack carried over from lawXgram
        lzh: b+zh+Dg
